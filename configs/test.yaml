# Fast Biological Process smoke-test configuration.
# Absolute paths make this usable from any working directory.
experiment:
  name: bp_test
  seed: 42
  output_dir: ./outputs/tacs_test
  ablation: seed_only
  retrain_from_scratch: true

data:
  task: biological_process
  swiss_csv: ./datasets/Swissprot/biological_process_trainable.csv
  trembl_source_csv: datasets/TREMBL/uniprotkb_taxonomy_id_2_AND_unreviewed_tr_2025_08_20_processed.csv
  trembl_candidates: ./outputs/tacs/data/biological_process_trembl_candidates.parquet
  conflict_policy: specific_over_background
  background_label: 0

split:
  method: random
  seed_fraction: 0.20
  candidate_fraction: 0.60
  validation_fraction: 0.10
  test_fraction: 0.10
  min_validation_per_class: 30
  min_test_per_class: 30
  rare_class_max_size: 500
  rare_class_seed_fraction: 0.50

model:
  esm_model_name: facebook/esm2_t6_8M_UR50D
  encoder_mode: lora
  max_length: 256
  classifier: mlp
  hidden_dim: 128
  dropout: 0.20
  device: cuda

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query, value]
  train_batch_size: 8
  inference_batch_size: 16
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  mixed_precision: bf16
  max_grad_norm: 1.0
  candidate_scan_per_round: 100
  log_every_steps: 10
  scan_log_every: 100

anchor:
  scope: active_swiss
  include_high_confidence_trembl: false
  metric: cosine
  k: 5
  distance_reduction: mean

selection:
  strategy: threshold_top_k
  confidence_threshold: 0.95
  knn_agreement_threshold: 0.90
  distance_threshold: null
  distance_temperature: 0.25
  require_model_knn_agreement: true
  require_trembl_model_agreement: true
  require_trembl_knn_agreement: false
  max_trembl_per_round: 100
  balance_by_class: true
  excluded_trembl_labels: [0]
  trembl_training_label: annotation

training:
  rounds: 1
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  swiss_weight: 1.0
  trembl_base_weight: 0.30
  num_workers: 0
  sampling_strategy: sqrt_inverse_frequency
  max_background_to_other_ratio: 1.0
  minimum_epochs_before_early_stopping: 1
  early_stopping_patience: 1

evaluation:
  bootstrap_samples: 0
  confidence_level: 0.95
