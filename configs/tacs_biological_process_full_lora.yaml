# Biological Process full-label TACS: ESM-2 650M LoRA with rotating Swiss label-0
# coverage followed by hard-negative mining. Validation and test retain their
# natural class distributions.
experiment:
  name: bp_full_ceiling20
  seed: 42
  output_dir: outputs/tacs
  ablation: full_tacs
  retrain_from_scratch: true

data:
  task: biological_process
  swiss_csv: datasets/Swissprot/biological_process_trainable.csv
  trembl_source_csv: datasets/TREMBL/uniprotkb_taxonomy_id_2_AND_unreviewed_tr_2025_08_20_processed.csv
  trembl_candidates: outputs/tacs/data/biological_process_trembl_candidates.parquet
  conflict_policy: specific_over_background
  background_label: 0
  candidate_read_batch_size: 10000

split:
  method: random
  seed_fraction: 0.20
  candidate_fraction: 0.60
  validation_fraction: 0.10
  test_fraction: 0.10
  min_validation_per_class: 30
  min_test_per_class: 30
  rare_class_max_size: 500
  rare_class_seed_fraction: 0.50

model:
  esm_model_name: facebook/esm2_t33_650M_UR50D
  encoder_mode: lora
  max_length: 1024
  classifier: mlp
  hidden_dim: 512
  dropout: 0.20
  device: cuda

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [query, value]
  train_batch_size: 128
  inference_batch_size: 64
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  mixed_precision: bf16
  max_grad_norm: 1.0
  candidate_scan_per_round: 250000
  log_every_steps: 50
  scan_log_every: 25000

anchor:
  scope: active_swiss
  include_high_confidence_trembl: false
  metric: cosine
  k: 10
  distance_reduction: mean

selection:
  strategy: threshold_top_k
  confidence_threshold: 0.20
  knn_agreement_threshold: 0.90
  distance_threshold: null
  distance_temperature: 0.25
  require_model_knn_agreement: true
  require_trembl_model_agreement: true
  require_trembl_knn_agreement: false
  max_trembl_per_round: 10000
  balance_by_class: true
  max_trembl_per_class_per_round: null
  excluded_trembl_labels: [0]
  trembl_training_label: annotation
  curriculum:
    - confidence: 0.20
      knn_agreement: 1.00
    - confidence: 0.20
      knn_agreement: 0.90
    - confidence: 0.20
      knn_agreement: 0.80

training:
  rounds: 3
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  swiss_weight: 1.0
  trembl_base_weight: 0.30
  num_workers: 0
  sampling_strategy: none
  max_background_to_other_ratio: null
  minimum_epochs_before_early_stopping: 10
  background_sampling:
    strategy: rotating_hard_negative
    background_label: 0
    background_to_non_background_ratio: 2.0
    coverage_epochs: 10
    hard_negative_fraction: 0.50
  early_stopping_patience: 3

evaluation:
  bootstrap_samples: 1000
  confidence_level: 0.95
